<body>
    <div class="container">
        <h1>🔄 Unit Converter</h1>
        
        <div class="converter-card">
            <label>Category</label>
            <select id="category" onchange="updateUnits()">
                <option value="length">📏 Length</option>
                <option value="weight">⚖️ Weight</option>
                <option value="temperature">🌡️ Temperature</option>
                <option value="volume">💧 Volume</option>
            </select>
            
            <label>Value</label>
            <input type="number" id="value" placeholder="Enter value" step="any">
            
            <div class="row">
                <div>
                    <label>From</label>
                    <select id="from"></select>
                </div>
                <div class="arrow">→</div>
                <div>
                    <label>To</label>
                    <select id="to"></select>
                </div>
            </div>
            
            <button onclick="convert()">Convert</button>
            
            <div id="result" class="result"></div>
        </div>
        
        <!-- NEW: Favorites Section -->
        <div id="favorites-container" class="favorites-container" style="display:none;">
            <div class="favorites-header">
                <h3>⭐ Favorite Conversions</h3>
                <button class="clear-btn" onclick="clearFavorites()">Clear All</button>
            </div>
            <div id="favorites-list" class="favorites-list"></div>
        </div>
        
        <!-- NEW: Conversion History Section -->
        <div id="history-container" class="history-container" style="display:none;">
            <div class="history-header">
                <h3>📜 Recent Conversions</h3>
                <button class="clear-btn" onclick="clearHistory()">Clear</button>
            </div>
            <div id="history-list" class="history-list"></div>
        </div>
        
        <!-- NEW: Batch Conversion Section -->
        <div id="batch-container" class="batch-container">
            <div class="batch-header">
                <h3>📋 Batch Conversion</h3>
                <span class="batch-hint">Convert multiple values at once (one per line)</span>
            </div>
            <div class="batch-input-area">
                <textarea id="batch-input" placeholder="Enter values here, one per line...&#10;Example:&#10;5&#10;10.5&#10;25&#10;100" rows="6"></textarea>
                <div class="batch-options">
                    <label>
                        <input type="checkbox" id="batch-include-units" checked>
                        Include units in output
                    </label>
                    <label>
                        <input type="checkbox" id="batch-comma-separated">
                        Comma-separated output
                    </label>
                </div>
                <button onclick="convertBatch()" class="batch-btn">🚀 Convert Batch</button>
            </div>
            <div id="batch-result" class="batch-result" style="display:none;">
                <div class="batch-result-header">
                    <h4>Results</h4>
                    <button class="copy-batch-btn" onclick="copyBatchResults()">📋 Copy All</button>
                </div>
                <textarea id="batch-output" readonly rows="6"></textarea>
                <div class="batch-stats" id="batch-stats"></div>
            </div>
        </div>
        
        <footer>
            Made with 💡 by <a href="https://github.com/Agent-Lumi">Lumi</a>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>

<script>
// Simple tutorial
const tutorialSteps = [
    { selector: 'h1', text: 'Welcome! This is the main title.' },
    { selector: 'button', text: 'Click here to perform actions.' }
];
let currentStep = 0;
function showTutorial() {
    if (currentStep < tutorialSteps.length) {
        const step = tutorialSteps[currentStep];
        const el = document.querySelector(step.selector);
        if (el) {
            const tooltip = document.createElement('div');
            tooltip.textContent = step.text;
            tooltip.style.cssText = 'position:absolute;background:#6f42c1;color:white;padding:10px;border-radius:5px;z-index:1000;';
            el.style.position = 'relative';
            el.appendChild(tooltip);
            setTimeout(() => tooltip.remove(), 3000);
        }
        currentStep++;
    }
}
// Show tutorial on first visit
if (!localStorage.getItem('tutorial-shown')) {
    setTimeout(showTutorial, 1000);
    localStorage.setItem('tutorial-shown', 'true');
}
</script>

<script>
// Export functionality
function exportData(format) {
    const data = document.querySelector('textarea, input')?.value || document.body.innerText;
    const blob = new Blob([data], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'export.' + format;
    a.click();
    URL.revokeObjectURL(url);
}
</script>
<script>
// Share functionality
const shareBtn = document.createElement('button');
shareBtn.textContent = '🔗 Share';
shareBtn.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:10px 20px;background:#6f42c1;color:white;border:none;border-radius:20px;cursor:pointer;';
shareBtn.onclick = () => {
    if (navigator.share) {
        navigator.share({ title: document.title, url: location.href });
    } else {
        navigator.clipboard.writeText(location.href);
        shareBtn.textContent = '✅ Copied!';
        setTimeout(() => shareBtn.textContent = '🔗 Share', 2000);
    }
};
document.body.appendChild(shareBtn);
</script>
<script>
// Copy result functionality
function copyResult() {
    const resultText = document.getElementById('result').innerText;
    if (resultText && resultText.includes('=')) {
        const cleanText = resultText.replace(/<[^>]*>/g, '').trim();
        navigator.clipboard.writeText(cleanText).then(() => {
            const btn = document.getElementById('copyBtn');
            const originalText = btn.textContent;
            btn.textContent = '✅ Copied!';
            btn.disabled = true;
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
            }, 1500);
        });
    }
}

// Add copy button next to result
document.addEventListener('DOMContentLoaded', () => {
    const resultDiv = document.getElementById('result');
    if (resultDiv) {
        const copyBtn = document.createElement('button');
        copyBtn.id = 'copyBtn';
        copyBtn.textContent = '📋 Copy';
        copyBtn.className = 'copy-btn';
        copyBtn.onclick = copyResult;
        copyBtn.style.cssText = 'margin-top: 10px; padding: 8px 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem;';
        resultDiv.parentNode.insertBefore(copyBtn, resultDiv.nextSibling);
    }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    // Ctrl/Cmd + Enter = Convert
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        convert();
    }
    // Ctrl/Cmd + C = Copy result (if result exists)
    if ((e.ctrlKey || e.metaKey) && e.key === 'c' && e.shiftKey) {
        e.preventDefault();
        copyResult();
    }
    // Escape = Clear input
    if (e.key === 'Escape') {
        document.getElementById('value').value = '';
        document.getElementById('value').focus();
        document.getElementById('result').innerHTML = '';
    }
    // Tab between From/To
    if (e.key === 'Tab' && e.shiftKey) {
        const fromSelect = document.getElementById('from');
        const toSelect = document.getElementById('to');
        if (document.activeElement === fromSelect) {
            e.preventDefault();
            toSelect.focus();
        }
    }
    // Ctrl/Cmd + Shift + B = Focus batch input
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'b') {
        e.preventDefault();
        const batchInput = document.getElementById('batch-input');
        if (batchInput) {
            batchInput.focus();
            batchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
});

// Show keyboard shortcuts hint
document.addEventListener('DOMContentLoaded', () => {
    const container = document.querySelector('.container');
    const hint = document.createElement('div');
    hint.className = 'keyboard-hint';
    hint.innerHTML = '⌨️ <strong>Shortcuts:</strong> Ctrl+Enter = Convert | Esc = Clear | Shift+Ctrl+C = Copy | Shift+Ctrl+B = Batch';
    hint.style.cssText = 'margin-top: 20px; padding: 12px; background: rgba(102,126,234,0.1); border-radius: 8px; font-size: 0.85rem; color: #667eea; text-align: center;';
    container.appendChild(hint);
});
</script>
